name: Approve LocalPrintServer deployment

on:
  workflow_dispatch:

# Only this manually launched workflow may write the deployment request branch.
permissions:
  contents: write
  actions: read

concurrency:
  group: localprintserver-deployment-approval
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve the latest tested commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const branch = repository.default_branch;
            const { data: defaultBranch } = await github.rest.repos.getBranch({
              owner, repo, branch
            });
            const targetSha = defaultBranch.commit.sha;
            // The manual button must be run from the repository's default branch. Otherwise
            // the Action run SHA differs from the main SHA and the PC correctly rejects it.
            if (context.ref !== \`refs/heads/\${branch}\` || context.sha !== targetSha) {
              core.setFailed(
                \`Run this workflow from the default branch (\${branch}) so the approval run and target SHA match.\`
              );
              return;
            }

            // Never create a deployment request unless CI passed for this exact main commit.
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "tests.yml", branch, per_page: 100
            });
            const passingRun = runs.workflow_runs.find(run =>
              run.head_sha === targetSha &&
              run.status === "completed" &&
              run.conclusion === "success"
            );
            if (!passingRun) {
              core.setFailed(
                `No successful Automated tests run was found for ${targetSha}. ` +
                "Wait for the tests workflow on the latest default-branch commit to pass, then click Run workflow again."
              );
              return;
            }

            const request = {
              schema_version: 1,
              request_id: `${context.runId}-${context.runAttempt}`,
              source_repository: `${owner}/${repo}`,
              source_branch: branch,
              target_commit_sha: targetSha,
              requested_at_utc: new Date().toISOString(),
              approved_by: context.actor,
              workflow_run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            };
            const path = "deployment/approved-release.json";
            let existingSha;
            try {
              const { data: current } = await github.rest.repos.getContent({
                owner, repo, path, ref: "deployment-requests"
              });
              if (Array.isArray(current) || current.type !== "file") {
                throw new Error("Unexpected deployment request file type.");
              }
              existingSha = current.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.git.createRef({
                  owner, repo, ref: "refs/heads/deployment-requests", sha: targetSha
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                // A previous/concurrent invocation created the branch; the update below is authoritative.
              }
            }

            // Re-fetch after branch creation so updates use the current blob SHA.
            try {
              const { data: current } = await github.rest.repos.getContent({
                owner, repo, path, ref: "deployment-requests"
              });
              if (!Array.isArray(current) && current.type === "file") existingSha = current.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const content = Buffer.from(JSON.stringify(request, null, 2) + "\n").toString("base64");
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path,
              message: `Approve LocalPrintServer deployment ${targetSha.slice(0, 12)}`,
              content,
              branch: "deployment-requests",
              ...(existingSha ? { sha: existingSha } : {})
            });
            core.notice(`Approved deployment of ${targetSha}. The server will pick it up when its scheduled poll runs.`);
